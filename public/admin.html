<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEV EHV | Admin</title><style>
:root{--ink:#211d1a;--ink2:#2d2723;--paper:#f5f1e9;--muted:#817a72;--copper:#a96843;--line:#dfd6ca}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px Arial,sans-serif}.shell{max-width:1180px;margin:auto;padding:28px}.top{background:var(--ink);color:#fffaf3}.top .shell{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:120px;height:auto}.eyebrow{font:10px monospace;letter-spacing:.18em;color:#b8aaa0}.btn{border:0;padding:12px 16px;background:var(--copper);color:white;cursor:pointer;border-radius:2px}.btn.secondary{background:transparent;border:1px solid rgba(255,250,243,.2)}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:#fffaf3;border:1px solid var(--line);padding:32px;width:min(100%,430px);box-shadow:0 25px 70px rgba(33,29,26,.08)}h1{font-size:36px;margin:0 0 8px}input,select{width:100%;padding:13px;border:1px solid var(--line);background:#fffaf3;margin:7px 0 18px;font:inherit}.error{color:#a33;min-height:20px}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0}.stat{background:#fffaf3;border:1px solid var(--line);padding:20px}.stat b{display:block;font-size:32px;margin-top:7px}.tablewrap{overflow:auto;background:#fffaf3;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:15px;border-bottom:1px solid var(--line);vertical-align:top}th{font:10px monospace;letter-spacing:.12em;color:var(--muted)}.message{max-width:320px;white-space:pre-wrap}.status{padding:7px;border-color:var(--line)}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.top .shell{align-items:flex-start}.brand img{width:95px}}
</style></head><body>
<section id="loginView" class="login"><form id="loginForm" class="card"><div class="eyebrow">DEV EHV SERVICES</div><h1>Admin access</h1><p style="color:var(--muted)">Manage website enquiries and project leads.</p><label for="username">Username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><div id="loginError" class="error" aria-live="polite"></div><button class="btn" style="width:100%">Sign in ↗</button></form></section>
<section id="appView" class="hidden"><header class="top"><div class="shell"><div class="brand"><img src="/dev-ehv-logo-transparent.png" alt="DEV EHV Services logo"><div><div class="eyebrow">CONTROL PANEL</div><strong>Enquiry management</strong></div></div><div style="display:flex;gap:10px"><a class="btn secondary" href="/api/admin/enquiries.csv">Export CSV</a><button class="btn secondary" id="logout">Logout</button></div></div></header><main class="shell"><div class="eyebrow">LIVE WEBSITE DATA</div><h1>Customer enquiries</h1><div class="stats"><div class="stat">TOTAL<b id="total">0</b></div><div class="stat">NEW<b id="new">0</b></div><div class="stat">CONTACTED<b id="contacted">0</b></div><div class="stat">COMPLETED<b id="completed">0</b></div></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Customer</th><th>Contact</th><th>Service</th><th>Requirement</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty hidden">No enquiries yet.</div></div></main></section>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let csrfToken='';
async function api(url,opt={}){const headers={'Content-Type':'application/json',...(opt.headers||{})};if(csrfToken)headers['X-CSRF-Token']=csrfToken;const r=await fetch(url,{...opt,headers});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function load(){try{const me=await api('/api/admin/me');if(!me.authenticated){csrfToken='';$('#loginView').classList.remove('hidden');$('#appView').classList.add('hidden');return}csrfToken=me.csrfToken;$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');const [items,stats]=await Promise.all([api('/api/admin/enquiries'),api('/api/admin/stats')]);$('#total').textContent=stats.total;$('#new').textContent=stats.byStatus.New||0;$('#contacted').textContent=stats.byStatus.Contacted||0;$('#completed').textContent=stats.byStatus.Completed||0;$('#rows').innerHTML=items.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}</td><td><b>${esc(x.name)}</b><br><small>${esc(x.company)}</small></td><td>${esc(x.email)}<br>${esc(x.phone)}</td><td>${esc(x.service)}</td><td class="message">${esc(x.message)}</td><td><select aria-label="Status for ${esc(x.name)}" class="status" onchange="updateStatus(${x.id},this.value)">${['New','Contacted','Completed'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="btn" onclick="removeItem(${x.id})">Delete</button></td></tr>`).join('');$('#empty').classList.toggle('hidden',items.length!==0)}catch(e){console.error(e)}}
window.updateStatus=async(id,status)=>{try{await api('/api/admin/enquiries/'+id,{method:'PATCH',body:JSON.stringify({status})});load()}catch(e){alert(e.message)}};window.removeItem=async id=>{if(confirm('Delete this enquiry?')){try{await api('/api/admin/enquiries/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}};$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('#username').value,password:$('#password').value})});load()}catch(e){$('#loginError').textContent=e.message}};$('#logout').onclick=async()=>{try{await api('/api/admin/logout',{method:'POST'});load()}catch(e){alert(e.message)}};load();
</script></body></html>
